name: Feature request
description: Suggest an improvement or new behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Maintainer:
        [@carlok](https://github.com/carlok).

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation are you hitting?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I understand ambient/LLM features are optional and off by default
          required: false
        - label: I am willing to help test or contribute a PR
          required: false
