[project]
name = "caciarabot"
version = "0.1.0"
description = "Italian-first, self-hosted reactive Telegram group bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "jsonschema>=4.21,<5",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
caciarabot = "caciarabot.main:run"
caciarabot-validate = "caciarabot.validate:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/caciarabot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
